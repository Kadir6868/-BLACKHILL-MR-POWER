<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Power · Arşiv Yönetimi</title><style>body{font:16px system-ui;background:#121214;color:#fff;max-width:700px;margin:35px auto;padding:20px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#242428;color:white;border:1px solid #555;border-radius:8px}textarea{height:220px}button{background:#e5a93b;color:#111;font-weight:bold}</style><h1>BLACKHILL · Arşiv Yönetimi</h1><p>Yalnızca yönetici erişimi. Yönetici anahtarı tarayıcıda saklanmaz.</p><form id="f"><input id="token" type="password" placeholder="ADMIN_TOKEN" required autocomplete="off"><input id="title" placeholder="Belge başlığı" required><input id="category" placeholder="Kategori" value="Araştırma"><input id="url" type="url" placeholder="Kaynak bağlantısı (isteğe bağlı)"><textarea id="body" placeholder="Belge metnini buraya yapıştırın (PDF önce metne çevrilmeli)" required></textarea><button>Arşive ekle</button></form><p id="status" role="status"></p><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const v=id=>document.getElementById(id).value;const status=document.getElementById('status');status.textContent='Kaydediliyor...';try{const r=await fetch('/api/admin/documents',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+v('token')},body:JSON.stringify({title:v('title'),category:v('category'),source_url:v('url'),body:v('body')})});const data=await r.json();status.textContent=r.ok?'Belge kaydedildi. ID: '+data.id:data.error||'Hata';if(r.ok)document.getElementById('body').value='';}catch{status.textContent='Bağlantı hatası';}};</script></html>
