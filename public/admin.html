<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLACKHILL · Mr. Power</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0d0d0f; color: #f4f4f5; margin: 0; padding: 24px; }
      .wrap { max-width: 900px; margin: 0 auto; }
      h1 { font-size: 2.3rem; }
      .card { background: #17171b; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 18px; }
      .msg { background: #1f1f24; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
      form { display: flex; gap: 10px; margin-top: 20px; }
      input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: white; }
      button { background: #e5a93b; border: 0; color: #111; font-weight: 700; padding: 12px 20px; border-radius: 10px; cursor: pointer; }
      .muted { color: #a1a1aa; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Mr. <span style="color:#e5a93b">Power</span> AI</h1>
      <p class="muted">BLACKHILL araştırma asistanı</p>
      <div class="card">
        <div id="messages" class="msg">Merhaba! Ben Mr. Power. Sorularınızı sorabilirsiniz.</div>
        <form id="chat-form">
          <input id="message" type="text" placeholder="Sorunuz nedir?" />
          <button type="submit">Gönder</button>
        </form>
      </div>
    </div>
    <script src="/widget.js"></script>
  </body>
</html>
